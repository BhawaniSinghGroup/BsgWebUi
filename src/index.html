  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect');

      if (redirect && redirect.charAt(0) === '/') {
        var remaining = new URLSearchParams(params);
        remaining.delete('redirect');

        var query = remaining.toString();
        var target = redirect + (query ? '?' + query : '') + window.location.hash;

        window.history.replaceState(null, '', target);
      }
    })();
  </script>
