<!doctype html>
<html lang="en">
  <head>

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var l = window.location;
        if (l.pathname !== '/' && !l.pathname.endsWith('.html')) {
          l.replace(l.protocol + '//' + l.host + '/?redirect=' + encodeURIComponent(l.pathname));
        }
      })();
    </script>
  </head>
